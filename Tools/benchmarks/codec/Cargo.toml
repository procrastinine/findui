[package]
name = "findui-codec-benchmark"
version = "0.0.0"
edition = "2021"
[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["runtime_detection"] }
sha2 = "=0.11.0"
serde_json = "1"
[features]
miniz = ["flate2/rust_backend"]
zlib-rs = ["flate2/zlib-rs"]
[profile.release]
lto = "thin"
